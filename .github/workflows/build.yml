name: 'Build'

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Checkout codebase'
        uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix build -L
