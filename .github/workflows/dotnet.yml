name: Python

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]
        python-version: [ '3.13' ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Java (for ANTLR4)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install ANTLR4
      run: pip install antlr4-tools
    - name: Generate parser
      working-directory: ./src/formula/api/parser
      run: antlr4 -Dlanguage=Python3 -visitor -no-listener FormulaLexer.g4 FormulaParser.g4
    - name: Install package
      run: pip install -e ".[dev]"
    - name: Run tests
      run: pytest tests/ -v
